<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Profile</title>
    <link rel="stylesheet" href="styles.css">
    <script 
        src="https://kit.fontawesome.com/1230fb126e.js"
        crossorigin="anonymous">
    </script>
</head>
<body>

    <div class="card">

       <div class="formas-bottom">
        <!-- Onda azul clara -->
        <svg class="onda onda-clara" viewBox="0 0 300 180">
            <path fill="#A9C7F5"
            d="M0 75 C45 15 75 10 115 65
            C145 105 180 120 230 115
            C260 110 280 135 300 180
            L0 180 Z"/>
        </svg>

        <!-- Onda azul escura -->
        <svg class="onda onda-escura" viewBox="0 0 300 180">
            <path fill="#142F63"
            d="M0 55 C55 70 75 90 105 125
            C130 155 160 165 190 180
            L0 180 Z"/>
        </svg>

        <!-- Onda azul intermediária -->
        <svg class="onda onda-azul" viewBox="0 0 300 180">
            <path fill="#1760A5"
            d="M0 125 C45 100 65 110 100 145
            C125 170 145 175 170 180
            L0 180 Z"/>
        </svg>

        </div>

        <div class="profile-image">
            <div class="img"> </div>
        </div>
        <div class="title">Julia Mariana</div>
        <div class="about">Analista de Sistemas</div>
        <div class="social-icon">
            <a href="https://www.instagram.com/_julia_maryana/" target="_blank"><i class="fab fa-instagram">
            </i></a>
            <a href="https://www.linkedin.com/in/juliafreire23/" target="_blank"><i class="fab fa-linkedin-in">
            </i></a>
            <a href="https://github.com/JuliaFreire4" target="_blank"><i class="fab fa-github">
            </i></a>
        </div>
        <button class="contact-me" onclick="window.open('https://w.app/wny2i8', '_blank')">
        Contate-me
        </button>
    </div>
</body>
</html>
